[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nubli"
version = "0.1.0"
description = "Local-first document anonymizer for safely sharing private files with AI tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nubli contributors" }]
keywords = ["privacy", "anonymization", "redaction", "pdf", "ocr", "local-first", "ai-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24.0", "pillow>=10.0.0"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0.0"]
docx = ["python-docx>=1.1.0"]
xlsx = ["openpyxl>=3.1.0"]
ner = ["spacy>=3.7,<4"]
all = ["pymupdf>=1.24.0", "pytesseract>=0.3.10", "pillow>=10.0.0", "python-docx>=1.1.0", "openpyxl>=3.1.0"]

[project.scripts]
nubli = "nubli:main"

[tool.setuptools]
py-modules = ["nubli"]
